name: Build image

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Repository (e.g., openwrt/openwrt, hdfla/openwrt)'
        required: true
        type: string
        default: 'hdfla/openwrt'
      branch:
        description: 'Branch or tag (e.g., main, openwrt-23.05, v23.05.4)'
        required: true
        type: string
        default: 'main'
      board:
        description: 'Board (used for config selection and cache key)'
        required: true
        type: choice
        default: 'filogic (mt798x)'
        options:
          - filogic (mt798x)
          - ramips (mt7621)
          - airoha (an75xx)
          - maple (ipq50xx)
          - cypress (ipq60xx)
          - akronite (ipq806x)
          - hawkeye (ipq807x)
          - hawkeye-nss (ipq807x-offload)
          - honeybee (qca953x)
          - scorpion (qca955x)
          - dragonfly (qcn550x)
      # ------------------------------------------------------------------
      # CUSTOM KERNEL SECTION
      # Leave empty to fall back to the stock OpenWrt flow (kernel.org
      # tarball + patches). When set to "owner/repo", the latest commit on
      # the repository's default branch is cloned and used as an external
      # kernel tree for ANY board.
      # ------------------------------------------------------------------
      custom_kernel_repo:
        description: 'Custom kernel repo (owner/repo). Auto-picks latest default-branch commit. Empty = stock OpenWrt kernel.'
        required: false
        type: string
        default: ''
      hostname:
        description: 'Hostname'
        required: true
        type: string
        default: 'OpenWrt'
      default_ip:
        description: 'Default IP address'
        required: true
        type: string
        default: '192.168.1.1'
      luci_theme:
        description: 'Default LuCI theme'
        required: true
        type: choice
        default: 'bootstrap'
        options:
          - bootstrap
          - aurora
          - argon
      verbosity:
        description: 'Verbose build output (V=s)'
        required: true
        type: choice
        default: 'No'
        options:
          - 'Yes'
          - 'No'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Set up build dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Clone OpenWrt source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.variant }}
          ref: ${{ github.event.inputs.branch }}
          path: openwrt
          token: ${{ secrets.OWRTPAT }}
          fetch-depth: 1

      - name: Cache OpenWrt build (cachewrtbuild)
        uses: stupidloud/cachewrtbuild@main
        with:
          prefix: ${{ github.workspace }}/openwrt
          mixkey: ${{ github.event.inputs.board }}
          ccache: 'false'
          clean: 'false'

      # ------------------------------------------------------------------
      # CUSTOM KERNEL: clone the requested repo at its latest default-branch
      # commit. Skipped entirely when custom_kernel_repo is empty — the
      # build then falls back to the stock kernel.org tarball + patches
      # exactly as before, driven purely by the selected .config.
      # ------------------------------------------------------------------
      - name: Prepare custom kernel tree
        if: ${{ github.event.inputs.custom_kernel_repo != '' }}
        run: |
          set -e
          KERNEL_DIR="${{ github.workspace }}/custom_kernel"
          KERNEL_REPO="https://github.com/${{ github.event.inputs.custom_kernel_repo }}.git"

          rm -rf "$KERNEL_DIR"
          git clone "$KERNEL_REPO" "$KERNEL_DIR"
          cd "$KERNEL_DIR"

          KERNEL_COMMIT=$(git rev-parse HEAD)
          KERNEL_BRANCH=$(git rev-parse --abbrev-ref HEAD)

          echo "Custom kernel : ${{ github.event.inputs.custom_kernel_repo }}"
          echo "Branch        : ${KERNEL_BRANCH}"
          echo "Commit        : ${KERNEL_COMMIT}"

          echo "CUSTOM_KERNEL_REPO=${{ github.event.inputs.custom_kernel_repo }}" >> $GITHUB_ENV
          echo "CUSTOM_KERNEL_COMMIT=${KERNEL_COMMIT}" >> $GITHUB_ENV
          echo "CUSTOM_KERNEL_BRANCH=${KERNEL_BRANCH}" >> $GITHUB_ENV

          # Force a pure-numeric version. APK rejects anything else, and
          # EXTRAVERSION (e.g. -dirty or a git-describe suffix) leaks
          # straight into kmod-* package versions.
          sed -i -E 's/^(EXTRAVERSION[[:space:]]*=).*/\1/' Makefile
          echo "===== Kernel Makefile version ====="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile

          grep -qE '^VERSION[[:space:]]*='      Makefile
          grep -qE '^PATCHLEVEL[[:space:]]*='   Makefile
          grep -qE '^SUBLEVEL[[:space:]]*='     Makefile

      - name: Custom feeds, packages and files
        run: |
          set -e
          cd openwrt

          BOARD="${{ github.event.inputs.board }}"
          BOARD_SHORT=$(echo "$BOARD" | sed -E 's/ *\(.*\)//' | sed 's/ /-/g')
          echo "Board short name: $BOARD_SHORT"

          FEEDS_FILE="../feeds-${BOARD_SHORT}"
          if [ -f "$FEEDS_FILE" ]; then
            cp "$FEEDS_FILE" feeds.conf
            echo "Using $FEEDS_FILE -> feeds.conf"
          else
            echo "No $FEEDS_FILE found, keeping source default feeds.conf"
          fi

          if [ -f ../packages ]; then
            mkdir -p package
            while read url; do
              [ -z "$url" ] && continue
              folder="${url##*/}"; folder="${folder%.git}"
              git clone "$url" "package/$folder"
              echo "Cloned $folder"
            done < ../packages
          fi

          FILES_DIR="../files-${BOARD_SHORT}"
          if [ -d "$FILES_DIR" ]; then
            cp -r "$FILES_DIR" files
            echo "Using $FILES_DIR -> files/ overlay"
          elif [ -d ../files ]; then
            cp -r ../files files
            echo "Using ../files -> files/ overlay"
          else
            echo "No files/ overlay found (checked $FILES_DIR and ../files)"
          fi

      - name: Update feeds
        run: |
          cd openwrt
          git config --global url."https://x-access-token:${{ secrets.KNFLPAT }}@github.com/hdfla/embedded-files".insteadOf "https://github.com/hdfla/embedded-files"
          ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Apply personalization
        run: |
          cd openwrt
          NEW_IP="${{ github.event.inputs.default_ip }}"
          OLD_IP_PATTERN='192.168.[0-9]\{1,3\}.1'
          sed -i "s/$OLD_IP_PATTERN/$NEW_IP/g" package/base-files/files/bin/config_generate

          HOSTNAME="${{ github.event.inputs.hostname }}"
          sed -i "s/set system.@system\[-1\].hostname='[^']*'/set system.@system[-1].hostname='$HOSTNAME'/" package/base-files/files/bin/config_generate

          THEME="${{ github.event.inputs.luci_theme }}"
          sed -i "s/luci-theme-bootstrap/luci-theme-$THEME/g" feeds/luci/collections/luci/Makefile

          echo "===== Personalization: IP=$NEW_IP, Hostname=$HOSTNAME, Theme=$THEME ====="

      - name: Configure build
        run: |
          set -e
          cd openwrt
          BOARD="${{ github.event.inputs.board }}"
          BOARD_SHORT=$(echo "$BOARD" | sed -E 's/ *\(.*\)//' | sed 's/ /-/g')
          CONFIG_FILE="../config-${BOARD_SHORT}"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Error: Config file '$CONFIG_FILE' not found!"
            exit 1
          fi
          cp "$CONFIG_FILE" .config
          echo "Using config: $CONFIG_FILE"

          # ----------------------------------------------------------------
          # CUSTOM KERNEL (any board, only when requested): switch .config
          # from the stock CONFIG_KERNEL_GIT_CLONE_URI path to an external
          # kernel tree so LINUX_VERSION stays pure-numeric and APK accepts
          # every kmod-*. With no custom_kernel_repo, .config is untouched
          # and OpenWrt builds the stock kernel + patches as usual.
          # ----------------------------------------------------------------
          if [ -n "${{ github.event.inputs.custom_kernel_repo }}" ]; then
            KERNEL_DIR="${{ github.workspace }}/custom_kernel"
            echo "Rewriting .config for external kernel tree: $KERNEL_DIR"

            sed -i '/^CONFIG_KERNEL_GIT_CLONE_URI=/d' .config || true
            sed -i '/^CONFIG_KERNEL_GIT_REF=/d'       .config || true
            sed -i '/^# CONFIG_EXTERNAL_KERNEL_TREE is not set/d' .config || true
            sed -i '/^CONFIG_EXTERNAL_KERNEL_TREE=/d' .config || true
            sed -i '/^CONFIG_DEVEL=/d'                .config || true
            sed -i '/^# CONFIG_DEVEL is not set/d'    .config || true

            {
              echo 'CONFIG_DEVEL=y'
              echo "CONFIG_EXTERNAL_KERNEL_TREE=\"$KERNEL_DIR\""
            } >> .config
          fi

          echo "Current .config (first 30 lines):"
          head -30 .config
          make defconfig
          grep -q "CONFIG_TARGET" .config || { echo "Error: .config invalid (no CONFIG_TARGET)"; exit 1; }

          if [ -n "${{ github.event.inputs.custom_kernel_repo }}" ]; then
            if ! grep -q '^CONFIG_EXTERNAL_KERNEL_TREE="' .config; then
              echo "FATAL: CONFIG_EXTERNAL_KERNEL_TREE did not survive defconfig"
              grep -n 'EXTERNAL_KERNEL_TREE\|KERNEL_GIT\|LINUX_VERSION' .config || true
              exit 1
            fi
            grep -n 'EXTERNAL_KERNEL_TREE\|KERNEL_GIT\|LINUX_VERSION' .config || true
          fi
          echo ".config is valid."

      - name: Build firmware
        run: |
          cd openwrt
          DEBUG="${{ github.event.inputs.verbosity == 'Yes' && 'V=s' || '' }}"
          make -j$(nproc) $DEBUG
          echo "DEVICE_NAME=_${{ github.event.inputs.board }}" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Check space usage
        run: df -hT

      - name: Organize files
        id: organize
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: List firmware files
        run: |
          cd "$FIRMWARE"
          echo "===== Firmware directory contents ====="
          ls -la
          echo ""
          echo "===== File summary ====="
          for ext in bin fip itb; do
            count=$(ls -1 *.$ext 2>/dev/null | wc -l)
            echo "  *.$ext : ${count} file(s)"
            ls -1 *.$ext 2>/dev/null || true
          done

      # ------------------------------------------------------------------
      # ATF / boot artifact collector.
      #   *bl*.bin | *bl*.fip | *bl*.itb | *bl*.lzma
      #     — bl2/bl21/bl22/bl23/bl31/bl32/bl33/bl412 in any of the
      #       canonical extensions.
      #   flash_table.{bin,lzma,*}
      #     — the only boot artifact without a 'bl' prefix.
      # Final board-prefixed images are pulled from STAGING_DIR_IMAGE as
      # *.bin / *.fip / *.itb / *.lzma (already curated by OpenWrt).
      # ------------------------------------------------------------------
      - name: Collect ATF build artifacts
        run: |
          set -e
          cd openwrt

          TARGET_DIR="$FIRMWARE"
          if [ -z "$TARGET_DIR" ] || [ ! -d "$TARGET_DIR" ]; then
            echo "::warning::FIRMWARE directory not set or missing; skipping ATF collection"
            exit 0
          fi

          mkdir -p "$TARGET_DIR/atf"

          declare -A seen=()
          copy_if_new() {
            local f="$1"
            [ -f "$f" ] || return 0
            local real
            real=$(realpath "$f")
            [ -n "${seen[$real]:-}" ] && return 0
            seen[$real]=1
            cp -vL "$f" "$TARGET_DIR/atf/" 2>/dev/null || true
          }

          echo "===== Searching for ATF / boot artifacts ====="

          # 1) ATF build directories: only *bl*.{bin,fip,itb,lzma} and
          #    flash_table.* (the only artifact without a 'bl' prefix).
          while IFS= read -r d; do
            [ -n "$d" ] || continue
            for pat in '*bl*.bin' '*bl*.fip' '*bl*.itb' '*bl*.lzma' \
                       'flash_table.bin' 'flash_table.lzma' 'flash_table.*'; do
              for f in "$d"/$pat; do
                copy_if_new "$f"
              done
            done
          done < <(find build_dir -maxdepth 6 -type f \
                     \( -iname '*bl*.bin' -o -iname '*bl*.fip' \
                        -o -iname '*bl*.itb' -o -iname '*bl*.lzma' \
                        -o -iname 'flash_table.*' \) 2>/dev/null \
                   | xargs -r -n1 dirname | sort -u)

          # 2) STAGING_DIR_IMAGE: final board-prefixed images.
          STAGING_IMG=$(find staging_dir -maxdepth 4 -type d -name image 2>/dev/null | head -n1)
          if [ -n "$STAGING_IMG" ]; then
            echo "STAGING_IMG = $STAGING_IMG"
            for pat in '*.bin' '*.fip' '*.itb' '*.lzma'; do
              for f in "$STAGING_IMG"/$pat; do
                copy_if_new "$f"
              done
            done
          else
            echo "STAGING_IMG = <none>"
          fi

          echo ""
          echo "===== atf/ contents ====="
          ls -la "$TARGET_DIR/atf/" || true

      - name: Upload firmware (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware
          path: openwrt/bin/targets/
          if-no-files-found: warn

      - name: Upload firmware with timestamped name
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          if-no-files-found: warn
          path: |
            ${{ env.FIRMWARE }}/*.bin
            ${{ env.FIRMWARE }}/*.fip
            ${{ env.FIRMWARE }}/*.itb
            ${{ env.FIRMWARE }}/atf/*
            openwrt/.config

      - name: Generate release tag and notes
        id: tag
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"

          RELEASE_FILE="$RUNNER_TEMP/release.txt"
          {
            echo "## OpenWrt Release $(date +"%Y.%m.%d-%H:%M")"
            echo "- Repository: ${{ github.event.inputs.variant }}"
            echo "- Branch: ${{ github.event.inputs.branch }}"
            echo "- Board: ${{ github.event.inputs.board }}"
            echo "- Hostname: ${{ github.event.inputs.hostname }}"
            echo "- IP: ${{ github.event.inputs.default_ip }}"
            echo "- Theme: ${{ github.event.inputs.luci_theme }}"
            if [ -n "${{ github.event.inputs.custom_kernel_repo }}" ]; then
              echo "- Custom kernel: ${{ github.event.inputs.custom_kernel_repo }} @ ${CUSTOM_KERNEL_BRANCH} (${CUSTOM_KERNEL_COMMIT})"
            else
              echo "- Custom kernel: (stock OpenWrt kernel)"
            fi
            echo "- Firmware files:"
          } > "$RELEASE_FILE"

          cd "$FIRMWARE"
          for ext in bin fip itb; do
            for f in *.$ext; do
              [ -f "$f" ] || continue
              echo "- $f" >> "$RELEASE_FILE"
              echo "  - md5: $(md5sum "$f" | cut -d' ' -f1)" >> "$RELEASE_FILE"
            done
          done
          if [ -f sha256sums ]; then
            echo "  - sha256: $(grep -oE '\w{64}' sha256sums | head -1)" >> "$RELEASE_FILE"
          fi

          if [ -d atf ]; then
            {
              echo ""
              echo "### ATF build artifacts (for debugging)"
            } >> "$RELEASE_FILE"
            for f in atf/*; do
              [ -f "$f" ] || continue
              sz=$(stat -c %s "$f")
              md=$(md5sum "$f" | cut -d' ' -f1)
              echo "- $f (${sz} bytes, md5 ${md})" >> "$RELEASE_FILE"
            done
          fi

          cp "$RELEASE_FILE" ./release.txt
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware to GitHub Release
        uses: softprops/action-gh-release@v1
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: |
            ${{ env.FIRMWARE }}/*.bin
            ${{ env.FIRMWARE }}/*.fip
            ${{ env.FIRMWARE }}/*.itb
            ${{ env.FIRMWARE }}/atf/*
            openwrt/.config
