name: Build image

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Repository (e.g., openwrt/openwrt, hdfla/openwrt)'
        required: true
        type: string
        default: 'hdfla/openwrt'
      branch:
        description: 'Branch or tag (e.g., main, openwrt-23.05, v23.05.4)'
        required: true
        type: string
        default: 'main'
      board:
        description: 'Board (used for config selection and cache key)'
        required: true
        type: choice
        default: 'filogic (mt798x)'
        options:
          - filogic (mt798x)
          - ramips (mt7621)
          - airoha (an75xx)
          - maple (ipq50xx)
          - cypress (ipq60xx)
          - akronite (ipq806x)
          - hawkeye (ipq807x)
          - hawkeye-nss (ipq807x-offload)
          - honeybee (qca953x)
          - scorpion (qca955x)
          - dragonfly (qcn550x)
      hostname:
        description: 'Hostname'
        required: true
        type: string
        default: 'OpenWrt'
      default_ip:
        description: 'Default IP address'
        required: true
        type: string
        default: '192.168.1.1'
      luci_theme:
        description: 'Default LuCI theme'
        required: true
        type: choice
        default: 'bootstrap'
        options:
          - bootstrap
          - aurora
          - argon
      verbosity:
        description: 'Verbose build output (V=s)'
        required: true
        type: choice
        default: 'No'
        options:
          - 'Yes'
          - 'No'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Set up build dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Clone OpenWrt source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.variant }}
          ref: ${{ github.event.inputs.branch }}
          path: openwrt
          token: ${{ secrets.OWRTPAT }}
          fetch-depth: 1

      - name: Cache OpenWrt build (cachewrtbuild)
        uses: stupidloud/cachewrtbuild@main
        with:
          prefix: ${{ github.workspace }}/openwrt
          mixkey: ${{ github.event.inputs.board }}
          ccache: 'false'
          clean: 'false'

      # ------------------------------------------------------------------
      # AIROHA ONLY: fetch the author's external kernel tree.
      # ------------------------------------------------------------------
      - name: Prepare external Airoha kernel tree
        if: ${{ github.event.inputs.board == 'airoha (an75xx)' }}
        run: |
          set -e
          KERNEL_DIR="${{ github.workspace }}/airoha_kernel"
          KERNEL_REPO="https://github.com/hdfla/airoha_kernel.git"
          KERNEL_REF="6665dcc1a65b1d00a0e72766f05764756fc2bf9f"

          rm -rf "$KERNEL_DIR"
          git clone "$KERNEL_REPO" "$KERNEL_DIR"
          cd "$KERNEL_DIR"
          git checkout "$KERNEL_REF"

          # Force a pure-numeric version. APK rejects anything else, and
          # EXTRAVERSION (e.g. -dirty or a git-describe suffix) leaks
          # straight into kmod-* package versions.
          sed -i -E 's/^(EXTRAVERSION[[:space:]]*=).*/\1/' Makefile
          echo "===== Kernel Makefile version ====="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile

          grep -qE '^VERSION[[:space:]]*='      Makefile
          grep -qE '^PATCHLEVEL[[:space:]]*='   Makefile
          grep -qE '^SUBLEVEL[[:space:]]*='     Makefile

      - name: Custom feeds, packages and files
        run: |
          set -e
          cd openwrt

          BOARD="${{ github.event.inputs.board }}"
          BOARD_SHORT=$(echo "$BOARD" | sed -E 's/ *\(.*\)//' | sed 's/ /-/g')
          echo "Board short name: $BOARD_SHORT"

          FEEDS_FILE="../feeds-${BOARD_SHORT}"
          if [ -f "$FEEDS_FILE" ]; then
            cp "$FEEDS_FILE" feeds.conf
            echo "Using $FEEDS_FILE -> feeds.conf"
          else
            echo "No $FEEDS_FILE found, keeping source default feeds.conf"
          fi

          if [ -f ../packages ]; then
            mkdir -p package
            while read url; do
              [ -z "$url" ] && continue
              folder="${url##*/}"; folder="${folder%.git}"
              git clone "$url" "package/$folder"
              echo "Cloned $folder"
            done < ../packages
          fi

          FILES_DIR="../files-${BOARD_SHORT}"
          if [ -d "$FILES_DIR" ]; then
            cp -r "$FILES_DIR" files
            echo "Using $FILES_DIR -> files/ overlay"
          elif [ -d ../files ]; then
            cp -r ../files files
            echo "Using ../files -> files/ overlay"
          else
            echo "No files/ overlay found (checked $FILES_DIR and ../files)"
          fi

      - name: Update feeds
        run: |
          cd openwrt
          git config --global url."https://x-access-token:${{ secrets.KNFLPAT }}@github.com/hdfla/embedded-files".insteadOf "https://github.com/hdfla/embedded-files"
          ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Apply personalization
        run: |
          cd openwrt
          NEW_IP="${{ github.event.inputs.default_ip }}"
          OLD_IP_PATTERN='192.168.[0-9]\{1,3\}.1'
          sed -i "s/$OLD_IP_PATTERN/$NEW_IP/g" package/base-files/files/bin/config_generate

          HOSTNAME="${{ github.event.inputs.hostname }}"
          sed -i "s/set system.@system\[-1\].hostname='[^']*'/set system.@system[-1].hostname='$HOSTNAME'/" package/base-files/files/bin/config_generate

          THEME="${{ github.event.inputs.luci_theme }}"
          sed -i "s/luci-theme-bootstrap/luci-theme-$THEME/g" feeds/luci/collections/luci/Makefile

          echo "===== Personalization: IP=$NEW_IP, Hostname=$HOSTNAME, Theme=$THEME ====="

      - name: Configure build
        run: |
          set -e
          cd openwrt
          BOARD="${{ github.event.inputs.board }}"
          BOARD_SHORT=$(echo "$BOARD" | sed -E 's/ *\(.*\)//' | sed 's/ /-/g')
          CONFIG_FILE="../config-${BOARD_SHORT}"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Error: Config file '$CONFIG_FILE' not found!"
            exit 1
          fi
          cp "$CONFIG_FILE" .config
          echo "Using config: $CONFIG_FILE"

          # ----------------------------------------------------------------
          # AIROHA ONLY: switch .config from git-clone kernel to external
          # kernel tree. Otherwise LINUX_VERSION gets contaminated with the
          # git ref and APK rejects every kmod-* package.
          # ----------------------------------------------------------------
          if [ "${{ github.event.inputs.board }}" = "airoha (an75xx)" ]; then
            KERNEL_DIR="${{ github.workspace }}/airoha_kernel"
            echo "Rewriting .config for external kernel tree: $KERNEL_DIR"

            sed -i '/^CONFIG_KERNEL_GIT_CLONE_URI=/d' .config || true
            sed -i '/^CONFIG_KERNEL_GIT_REF=/d'       .config || true
            sed -i '/^# CONFIG_EXTERNAL_KERNEL_TREE is not set/d' .config || true
            sed -i '/^CONFIG_EXTERNAL_KERNEL_TREE=/d' .config || true

            {
              echo 'CONFIG_DEVEL=y'
              echo "CONFIG_EXTERNAL_KERNEL_TREE=\"$KERNEL_DIR\""
            } >> .config
          fi

          echo "Current .config (first 30 lines):"
          head -30 .config
          make defconfig
          grep -q "CONFIG_TARGET" .config || { echo "Error: .config invalid (no CONFIG_TARGET)"; exit 1; }

          if [ "${{ github.event.inputs.board }}" = "airoha (an75xx)" ]; then
            if ! grep -q '^CONFIG_EXTERNAL_KERNEL_TREE="' .config; then
              echo "FATAL: CONFIG_EXTERNAL_KERNEL_TREE did not survive defconfig"
              grep -n 'EXTERNAL_KERNEL_TREE\|KERNEL_GIT\|LINUX_VERSION' .config || true
              exit 1
            fi
            grep -n 'EXTERNAL_KERNEL_TREE\|KERNEL_GIT\|LINUX_VERSION' .config || true
          fi
          echo ".config is valid."

      - name: Build firmware
        run: |
          cd openwrt
          DEBUG="${{ github.event.inputs.verbosity == 'Yes' && 'V=s' || '' }}"
          make -j$(nproc) $DEBUG
          echo "DEVICE_NAME=_${{ github.event.inputs.board }}" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Check space usage
        run: df -hT

      - name: Organize files
        id: organize
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Collect ATF build artifacts
        run: |
          set -e
          cd openwrt

          ATF_BUILD_DIR=$(find build_dir -maxdepth 6 -type f -name 'flash_table.bin' 2>/dev/null | head -n1 | xargs -r dirname)
          STAGING_IMG=$(find staging_dir -maxdepth 4 -type d -name image | head -n1)
          TARGET_DIR="$FIRMWARE"

          echo "ATF_BUILD_DIR = $ATF_BUILD_DIR"
          echo "STAGING_IMG   = $STAGING_IMG"
          echo "TARGET_DIR    = $TARGET_DIR"

          mkdir -p "$TARGET_DIR/atf"

          if [ -n "$ATF_BUILD_DIR" ]; then
            for f in bl21.bin bl22.lzma bl23.lzma flash_table.bin flash_table.lzma; do
              if [ -f "$ATF_BUILD_DIR/$f" ]; then
                cp -v "$ATF_BUILD_DIR/$f" "$TARGET_DIR/atf/"
              else
                echo "  (missing, skipped) $f"
              fi
            done
          fi

          if [ -n "$STAGING_IMG" ]; then
            for f in "$STAGING_IMG"/*-bl2.bin \
                     "$STAGING_IMG"/*-bl21.bin \
                     "$STAGING_IMG"/*-bl31.bin \
                     "$STAGING_IMG"/*-bl31.lzma; do
              [ -f "$f" ] && cp -v "$f" "$TARGET_DIR/atf/"
            done
          fi

          echo "===== atf/ contents ====="
          ls -la "$TARGET_DIR/atf/"

          if [ -f "$TARGET_DIR/atf/flash_table.bin" ]; then
            echo "===== HeYangTek entries found in flash_table.bin ====="
            if strings "$TARGET_DIR/atf/flash_table.bin" | grep -q _SPI_NAND_DEVICE_ID_HYF1GQ4UDACAE; then
              strings "$TARGET_DIR/atf/flash_table.bin" | grep _SPI_NAND_DEVICE_ID_HYF || true
              echo "OK: HYF1GQ4UDACAE is present in the table."
            else
              echo "!!! FATAL: HYF1GQ4UDACAE not found in flash_table.bin."
              echo "!!! You MUST NOT flash this image."
              exit 1
            fi
          else
            echo "!!! WARNING: flash_table.bin was not found in the ATF build dir."
          fi

      - name: Upload firmware (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware
          path: openwrt/bin/targets/

      - name: Upload firmware with timestamped name
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag and notes
        id: tag
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"

          RELEASE_FILE="$RUNNER_TEMP/release.txt"
          {
            echo "## OpenWrt Release $(date +"%Y.%m.%d-%H:%M")"
            echo "- Repository: ${{ github.event.inputs.variant }}"
            echo "- Branch: ${{ github.event.inputs.branch }}"
            echo "- Board: ${{ github.event.inputs.board }}"
            echo "- Hostname: ${{ github.event.inputs.hostname }}"
            echo "- IP: ${{ github.event.inputs.default_ip }}"
            echo "- Theme: ${{ github.event.inputs.luci_theme }}"
            echo "- Firmware files:"
          } > "$RELEASE_FILE"

          cd "$FIRMWARE"
          for f in *.bin; do
            echo "- $f" >> "$RELEASE_FILE"
            echo "  - md5: $(md5sum "$f" | cut -d' ' -f1)" >> "$RELEASE_FILE"
          done
          if [ -f sha256sums ]; then
            echo "  - sha256: $(grep -oE '\w{64}' sha256sums | head -1)" >> "$RELEASE_FILE"
          fi

          if [ -d atf ]; then
            {
              echo ""
              echo "### ATF build artifacts (for debugging)"
            } >> "$RELEASE_FILE"
            for f in atf/*; do
              [ -f "$f" ] || continue
              sz=$(stat -c %s "$f")
              md=$(md5sum "$f" | cut -d' ' -f1)
              echo "- $f (${sz} bytes, md5 ${md})" >> "$RELEASE_FILE"
            done
          fi

          cp "$RELEASE_FILE" ./release.txt
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware to GitHub Release
        uses: softprops/action-gh-release@v1
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: |
            ${{ env.FIRMWARE }}/*.bin
            ${{ env.FIRMWARE }}/atf/*
            openwrt/.config
